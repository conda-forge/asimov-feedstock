{% set name = "asimov" %}
{% set version = "0.8.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: cdc5f3448d2cdc54bbd6fd2164d8c36c98c49cf13f927a04fa196bf5ea7a0dc2

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv
  entry_points:
    - locutus=asimov.locutus:cli
    - olivaw=asimov.olivaw:olivaw
    - asimov=asimov.olivaw:olivaw

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
    - setuptools_scm
  run:
    - alembic >=1.13.0
    - click
    - filelock >=3.13.0
    - flask
    - flask-cors >=4.0.0
    - git
    - gitpython
    - liquidpy
    - networkx
    - numpy
    - otter-report >=0.3.3
    - pillow >=10.2.0
    - pydantic >=2.0.0
    - python >={{ python_min }}
    - python-gitlab
    - python-htcondor
    - pytz
    - pyyaml
    - requests
    - setuptools
    - sqlalchemy >=2.0.0
    - tinydb

test:
  requires:
    - pip
    - git
    - python {{ python_min }}
  imports:
    - asimov
  commands:
    # check requirements
    - python -m pip check
    # check entry points
    - locutus --help
    - asimov --help
    - olivaw --help

about:
  home: https://asimov.docs.ligo.org/asimov/
  doc_url: https://asimov.docs.ligo.org/asimov/
  dev_url: https://git.ligo.org/asimov/asimov.git
  license: ISC
  license_file: LICENSE
  summary: Parameter Estimation automator for gravitational wave analyses.
  description: |
    Asimov is a python package designed to make organising and monitoring data analysis jobs easier.

extra:
  recipe-maintainers:
    - transientlunatic
    - duncanmmacleod
